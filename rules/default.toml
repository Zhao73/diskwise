# What lives where on a developer Mac, and whether it is safe to reclaim.
#
# suggest:
#   archive  - irreplaceable but compressible; tar.zst it, keep it readable
#   trash    - regenerable; move to the Trash, tools will rebuild it on demand
#   review   - big and worth a look, but only you know if it matters
#
# `match` globs are expanded against absolute paths; ~ means your home dir.

# ---------------------------------------------------------------- agent state

[[rule]]
id = "codex-sessions"
match = ["~/.codex/sessions", "~/.codex/archived_sessions"]
category = "agent-session"
regenerable = false
suggest = "archive"
retain_days = 30
note = "Codex conversation rollouts (.jsonl). Nothing regenerates these. Measured ~2.4x under zstd — lower than plain text because roughly half of a typical rollout is base64 image data. Archive, don't delete."
note_zh = "Codex 会话记录（.jsonl）。没有任何东西能重新生成它们。实测 zstd 压缩约 2.4x——比纯文本低，因为一份会话大约一半是 base64 图片数据。归档，别删。"

[[rule]]
id = "claude-projects"
match = ["~/.claude/projects"]
category = "agent-session"
regenerable = false
suggest = "archive"
retain_days = 30
note = "Claude Code session transcripts, one .jsonl per session. Needed for --resume; archive anything older than a month."
note_zh = "Claude Code 会话记录，每个会话一个 .jsonl。--resume 要用到；超过一个月的可以归档。"

[[rule]]
id = "agent-history-db"
match = ["~/.codex/thread_history_*.sqlite", "~/.codex/logs_*.sqlite", "~/.codex/sqlite"]
category = "agent-session"
regenerable = false
suggest = "review"
note = "Codex history/log databases. Deleting loses searchable history; vacuum or archive instead."
note_zh = "Codex 的历史/日志数据库。删掉会丢失可检索的历史，建议 vacuum 或归档，而不是删除。"

[[rule]]
id = "agent-sidecars"
match = ["~/.claude-mem", "~/.claude-science", "~/.grok", "~/.copilot", "~/.alphacouncil-agent", "~/.claude/homunculus"]
category = "agent-session"
regenerable = false
suggest = "review"
note = "State from agent plugins and side tools. Each grows unbounded and none of them prune."
note_zh = "各类 agent 插件和周边工具的状态目录。每一个都在无限增长，而且没有一个会自己清理。"

[[rule]]
id = "agent-generated-media"
match = ["~/.codex/generated_images", "~/.codex/visualizations", "~/.codex/computer-use"]
category = "agent-artifact"
regenerable = false
suggest = "review"
note = "Images and screenshots produced during agent runs. Almost always disposable, but look before you leap."
note_zh = "agent 运行过程中生成的图片和截图。几乎都是一次性的，但删之前先看一眼。"

[[rule]]
id = "agent-plugins"
match = ["~/.claude/plugins", "~/.codex/plugins"]
category = "agent-cache"
regenerable = true
suggest = "trash"
note = "Downloaded plugin/marketplace caches. Re-fetched on next use."
note_zh = "下载的插件/市场缓存。下次使用时会自动重新拉取。"

[[rule]]
id = "agent-scratch"
match = ["~/.claude/debug", "~/.claude/file-history", "~/.claude/jobs", "~/.codex/backups"]
category = "agent-cache"
regenerable = true
suggest = "trash"
retain_days = 14
note = "Debug logs, undo history and job scratch. Safe to drop once the sessions are over."
note_zh = "调试日志、撤销历史和任务临时文件。会话结束后即可丢弃。"

# ------------------------------------------------------------ build artifacts

[[rule]]
id = "node-modules"
match = ["**/node_modules"]
category = "build"
regenerable = true
suggest = "trash"
note = "Reinstall with npm/pnpm/yarn install."
note_zh = "用 npm/pnpm/yarn install 重新安装即可。"

[[rule]]
id = "rust-target"
match = ["**/target/debug", "**/target/release"]
category = "build"
regenerable = true
suggest = "trash"
note = "Rebuilt by cargo build."
note_zh = "cargo build 会重新生成。"

[[rule]]
id = "js-build-output"
match = ["**/.next", "**/.nuxt", "**/.turbo", "**/.parcel-cache", "**/dist", "**/build"]
category = "build"
regenerable = true
suggest = "trash"
note = "Regenerated by the project's build command."
note_zh = "由项目的构建命令重新生成。"

[[rule]]
id = "python-build"
match = ["**/__pycache__", "**/.venv", "**/venv", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache"]
category = "build"
regenerable = true
suggest = "trash"
note = "Recreated by the interpreter or by reinstalling the venv."
note_zh = "解释器或重装虚拟环境时会重新生成。"

[[rule]]
id = "xcode-derived"
match = ["~/Library/Developer/Xcode/DerivedData", "**/Pods", "~/Library/Developer/Xcode/Archives"]
category = "build"
regenerable = true
suggest = "trash"
note = "Xcode rebuilds DerivedData; pod install restores Pods. Archives are your shipped builds — check before clearing."
note_zh = "Xcode 会重建 DerivedData；pod install 恢复 Pods。Archives 是你已发布的构建产物——清理前先确认。"

# ---------------------------------------------------------- toolchain caches

[[rule]]
id = "package-manager-cache"
match = ["~/.npm", "~/.npm-global/_cacache", "~/.bun/install/cache", "~/.cache", "~/.cargo/registry/cache", "~/.cargo/registry/src", "~/Library/Caches/pip", "~/Library/Caches/Homebrew"]
category = "toolchain-cache"
regenerable = true
suggest = "trash"
note = "Package download caches. Re-downloaded on the next install."
note_zh = "包下载缓存。下次安装时重新下载。"

[[rule]]
id = "toolchain-versions"
match = ["~/.rustup/toolchains", "~/.pyenv/versions", "~/.nvm/versions"]
category = "toolchain"
regenerable = true
suggest = "review"
note = "Installed language versions. Regenerable, but reinstalling costs bandwidth — prune the ones you no longer use."
note_zh = "已安装的语言版本。可再生，但重装要耗流量——把不再用的版本清掉即可。"

[[rule]]
id = "app-caches"
match = ["~/Library/Caches"]
category = "toolchain-cache"
regenerable = true
suggest = "review"
note = "Every app's cache lives here. Mostly safe, but some apps store real data in it — drill in before clearing."
note_zh = "所有 App 的缓存都在这里。大部分可以安全清理，但有些 App 会把真实数据放进来——先下钻看看再动手。"

# ------------------------------------------------------------------ big iron

[[rule]]
id = "ios-simulators"
match = ["~/Library/Developer/CoreSimulator/Devices", "~/Library/Developer/Xcode/iOS DeviceSupport", "~/Library/Developer/CoreSimulator/Caches"]
category = "simulator"
regenerable = true
suggest = "review"
inspect = "simulators"
note = "Simulator runtimes and per-device data. Deleting a device loses its installed apps; `xcrun simctl delete unavailable` is the safe first pass."
note_zh = "模拟器运行时和各设备数据。删掉一个设备会丢失其中已安装的 App；先跑 `xcrun simctl delete unavailable` 是最稳妥的第一步。"

[[rule]]
id = "containers"
match = ["~/Library/Containers/com.docker.docker", "~/.docker", "~/.orbstack", "~/.colima"]
category = "vm"
regenerable = true
suggest = "review"
inspect = "docker"
note = "Docker/VM disk images. These are sparse files that never shrink on their own — prune from inside the tool, not with rm."
note_zh = "Docker/VM 磁盘镜像。这些是稀疏文件，永远不会自己缩小——要从工具内部 prune，不要用 rm。"

# ------------------------------------------------------------------ untouchable

[[rule]]
id = "protected"
match = ["~/.ssh", "~/.gnupg", "~/Library/Keychains", "~/Library/Mobile Documents", "**/.git", "~/Library/Application Support/MobileSync"]
category = "protected"
regenerable = false
suggest = "never"
note = "Credentials, iCloud Drive, git history, iOS backups. diskwise refuses to touch these regardless of configuration."
note_zh = "凭据、iCloud 云盘、git 历史、iOS 备份。无论怎么配置，diskwise 都拒绝碰这些。"
