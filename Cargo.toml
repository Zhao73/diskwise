[package]
name = "diskwise"
version = "0.1.0"
edition = "2021"
description = "macOS disk visualizer that knows what your AI agent folders are, and can safely archive or trash them"
license = "MIT"
repository = "https://github.com/zjp73/diskwise"

[dependencies]
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
anyhow = "1"
humansize = "2"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
