name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -czf diskwise-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release diskwise
      - uses: softprops/action-gh-release@v2
        with:
          files: diskwise-${{ matrix.target }}.tar.gz
