<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskwise</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d38; --text: #e6edf3;
    --dim: #8b949e; --accent: #d97757;
    --c-agent-session: #e0a458; --c-agent-cache: #4ec9b0; --c-agent-artifact: #a78bfa;
    --c-build: #58a6ff; --c-toolchain-cache: #2dd4bf; --c-toolchain: #7d8590;
    --c-simulator: #f472b6; --c-vm: #38bdf8; --c-protected: #f85149; --c-none: #3d444d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .stat { color: var(--dim); font-size: 13px; }
  .stat b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }
  button, select, input {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  main { padding: 16px 20px 60px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  nav { font-size: 13px; color: var(--dim); margin-bottom: 12px; word-break: break-all; }
  nav a { color: var(--text); text-decoration: none; cursor: pointer; }
  nav a:hover { color: var(--accent); }
  nav span { color: var(--line); margin: 0 4px; }
  #treemap { width: 100%; height: 300px; display: block; margin-bottom: 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #treemap rect { cursor: pointer; }
  #treemap rect:hover { opacity: .8; }
  #treemap text { pointer-events: none; font-size: 11px; fill: #0e1116; font-weight: 600; }
  #treemap text.sub { font-weight: 400; opacity: .75; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 8px; border-bottom: 1px solid #1b212b; vertical-align: middle; }
  tr.dir td.name { cursor: pointer; }
  tr:hover td { background: #141a22; }
  td.size { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 90px; }
  td.gauge { width: 120px; }
  .gauge div { height: 6px; border-radius: 3px; background: var(--c-none); }
  td.name { font-weight: 500; min-width: 170px; }
  td.name .kind { display: inline-block; }
  td.name .kind { color: var(--dim); margin-right: 6px; }
  th:nth-child(2) { width: 120px; }
  td.path { color: var(--dim); font-size: 12px; word-break: break-all; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    font-weight: 600; white-space: nowrap; }
  .note { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .warn { background: #2d1d12; border: 1px solid #5a3a1c; color: #e0a458;
    padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>diskwise</h1>
  <div class="stat" id="summary">scanning…</div>
  <div class="spacer"></div>
  <button id="rescan">Rescan</button>
</header>

<main>
  <div id="warn"></div>
  <div class="bar">
    <button id="mode-tree" class="on">Biggest anywhere</button>
    <button id="mode-dir">Browse folders</button>
    <button id="mode-files">Files only</button>
    <select id="category"><option value="">All categories</option></select>
    <select id="min">
      <option value="1048576">≥ 1 MB</option>
      <option value="10485760" selected>≥ 10 MB</option>
      <option value="104857600">≥ 100 MB</option>
      <option value="1073741824">≥ 1 GB</option>
      <option value="0">everything</option>
    </select>
    <input id="contains" type="search" placeholder="filter by path…" size="18">
    <div class="spacer"></div>
    <div class="stat" id="reclaim"></div>
  </div>

  <nav id="crumbs"></nav>
  <svg id="treemap"></svg>
  <table>
    <thead><tr>
      <th>Size</th><th></th><th>Name</th><th>What it is</th><th>Path</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Nothing here above the size filter.</div>
</main>

<script>
const $ = id => document.getElementById(id);
const state = { mode: 'tree', dir: null, root: '', category: '', min: 10485760, contains: '' };
const fmt = b => {
  const u = ['B','KB','MB','GB','TB'];
  let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
  return (i === 0 ? b : b.toFixed(b < 10 ? 2 : 1)) + ' ' + u[i];
};
const colorOf = cat => getComputedStyle(document.documentElement)
  .getPropertyValue('--c-' + (cat || 'none')).trim() || 'var(--c-none)';

async function loadStatus() {
  const s = await (await fetch('/api/status')).json();
  state.root = s.root;
  if (!state.dir) state.dir = s.root;
  $('summary').innerHTML = `<b>${fmt(s.total)}</b> in ${s.files.toLocaleString()} files
    · ${s.root} ${s.scanning ? '· <b>rescanning…</b>' : ''}`;
  $('warn').innerHTML = s.denied > 20
    ? `<div class="warn">${s.denied} paths were unreadable. Grant Full Disk Access in
       System Settings → Privacy &amp; Security to see all of ~/Library.</div>` : '';
  const sel = $('category');
  if (sel.options.length === 1) {
    for (const c of s.categories) sel.add(new Option(c, c));
  }
  if (s.scanning) setTimeout(loadStatus, 3000);
}

async function load() {
  const p = new URLSearchParams({ min: state.min, limit: 200 });
  if (state.mode === 'dir') p.set('dir', state.dir);
  if (state.mode === 'files') p.set('files', 'true');
  if (state.category) p.set('category', state.category);
  if (state.contains) p.set('contains', state.contains);
  const data = await (await fetch('/api/rows?' + p)).json();
  $('reclaim').innerHTML = data.reclaimable
    ? `reclaimable here: <b style="color:var(--accent)">${fmt(data.reclaimable)}</b>` : '';
  renderCrumbs();
  renderTable(data.rows);
  renderTreemap(data.rows);
}

function renderCrumbs() {
  const el = $('crumbs');
  if (state.mode !== 'dir') { el.innerHTML = ''; return; }
  const rel = state.dir.startsWith(state.root) ? state.dir.slice(state.root.length) : state.dir;
  const parts = rel.split('/').filter(Boolean);
  let acc = state.root;
  const links = [`<a data-p="${state.root}">${state.root}</a>`];
  for (const part of parts) {
    acc += '/' + part;
    links.push(`<a data-p="${acc}">${part}</a>`);
  }
  el.innerHTML = links.join('<span>/</span>');
  el.querySelectorAll('a').forEach(a => a.onclick = () => { state.dir = a.dataset.p; load(); });
}

function renderTable(rows) {
  $('empty').hidden = rows.length > 0;
  const max = rows.length ? rows[0].size : 1;
  $('rows').innerHTML = rows.map(r => {
    const v = r.verdict;
    const c = colorOf(v && v.category);
    const what = v
      ? `<span class="tag" style="background:${c}22;color:${c}">${v.category} · ${v.suggest}</span>
         <div class="note">${v.note}</div>`
      : '<span class="note">—</span>';
    return `<tr class="${r.is_dir ? 'dir' : 'file'}">
      <td class="size">${r.human}</td>
      <td class="gauge"><div style="width:${Math.max(2, r.size / max * 100)}%;background:${c}"></div></td>
      <td class="name" data-p="${r.is_dir ? r.path : ''}">
        <span class="kind">${r.is_dir ? '📁' : '📄'}</span>${escapeHtml(r.name)}</td>
      <td>${what}</td>
      <td class="path">${escapeHtml(r.path)}</td>
    </tr>`;
  }).join('');
  $('rows').querySelectorAll('td.name[data-p]:not([data-p=""])').forEach(td => {
    td.onclick = () => { state.mode = 'dir'; setMode(); state.dir = td.dataset.p; load(); };
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Squarified treemap: keeps rectangles close to square so small items stay clickable.
function squarify(items, x, y, w, h, out) {
  if (!items.length) return out;
  const total = items.reduce((a, i) => a + i.size, 0);
  if (total <= 0 || w < 1 || h < 1) return out;
  const horizontal = w >= h;
  const side = horizontal ? h : w;
  let row = [], rowSum = 0, best = Infinity;
  const worst = (sum, side, mn, mx) => {
    const s2 = sum * sum, sd2 = side * side;
    return Math.max((sd2 * mx) / s2, s2 / (sd2 * mn));
  };
  let i = 0;
  for (; i < items.length; i++) {
    const next = rowSum + items[i].size;
    const scale = (horizontal ? w : h) * side / total;
    const mn = Math.min(...row.map(r => r.size), items[i].size) * scale;
    const mx = Math.max(...row.map(r => r.size), items[i].size) * scale;
    const w2 = worst(next * scale, side, mn, mx);
    if (row.length && w2 > best) break;
    row.push(items[i]); rowSum = next; best = w2;
  }
  const frac = rowSum / total;
  const thick = (horizontal ? w : h) * frac;
  let off = 0;
  for (const item of row) {
    const len = side * (item.size / rowSum);
    out.push(horizontal
      ? { ...item, x, y: y + off, w: thick, h: len }
      : { ...item, x: x + off, y, w: len, h: thick });
    off += len;
  }
  return horizontal
    ? squarify(items.slice(i), x + thick, y, w - thick, h, out)
    : squarify(items.slice(i), x, y + thick, w, h - thick, out);
}

function renderTreemap(rows) {
  const svg = $('treemap');
  const W = svg.clientWidth || 900, H = 300;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const items = rows.slice(0, 40).filter(r => r.size > 0);
  const boxes = squarify(items, 0, 0, W, H, []);
  svg.innerHTML = boxes.map(b => {
    const c = colorOf(b.verdict && b.verdict.category);
    const label = b.w > 60 && b.h > 22
      ? `<text x="${b.x + 6}" y="${b.y + 16}">${escapeHtml(b.name.slice(0, Math.floor(b.w / 7)))}</text>
         ${b.h > 36 ? `<text class="sub" x="${b.x + 6}" y="${b.y + 30}">${b.human}</text>` : ''}`
      : '';
    return `<g><rect x="${b.x + .5}" y="${b.y + .5}" width="${Math.max(0, b.w - 1)}"
      height="${Math.max(0, b.h - 1)}" fill="${c}" rx="2" data-p="${b.is_dir ? b.path : ''}">
      <title>${escapeHtml(b.path)}\n${b.human}${b.verdict ? '\n' + b.verdict.category + ' · ' + b.verdict.suggest : ''}</title>
      </rect>${label}</g>`;
  }).join('');
  svg.querySelectorAll('rect[data-p]:not([data-p=""])').forEach(r => {
    r.onclick = () => { state.mode = 'dir'; setMode(); state.dir = r.dataset.p; load(); };
  });
}

function setMode() {
  for (const m of ['tree', 'dir', 'files']) $('mode-' + m).classList.toggle('on', state.mode === m);
}
for (const m of ['tree', 'dir', 'files']) {
  $('mode-' + m).onclick = () => { state.mode = m; setMode(); load(); };
}
$('category').onchange = e => { state.category = e.target.value; load(); };
$('min').onchange = e => { state.min = +e.target.value; load(); };
let t; $('contains').oninput = e => {
  clearTimeout(t); t = setTimeout(() => { state.contains = e.target.value; load(); }, 250);
};
$('rescan').onclick = async () => { await fetch('/api/rescan', { method: 'POST' }); loadStatus(); };
window.onresize = () => load();

loadStatus().then(load);
</script>
</body>
</html>
