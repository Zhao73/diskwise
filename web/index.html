<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskwise</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d38; --text: #e6edf3;
    --dim: #8b949e; --accent: #d97757;
    --c-agent-session: #e0a458; --c-agent-cache: #4ec9b0; --c-agent-artifact: #a78bfa;
    --c-build: #58a6ff; --c-toolchain-cache: #2dd4bf; --c-toolchain: #7d8590;
    --c-simulator: #f472b6; --c-vm: #38bdf8; --c-protected: #f85149; --c-none: #3d444d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .stat { color: var(--dim); font-size: 13px; }
  .stat b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }
  button, select, input {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  main { padding: 16px 20px 60px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  nav { font-size: 13px; color: var(--dim); margin-bottom: 12px; word-break: break-all; }
  nav a { color: var(--text); text-decoration: none; cursor: pointer; }
  nav a:hover { color: var(--accent); }
  nav span { color: var(--line); margin: 0 4px; }
  #treemap { width: 100%; height: 300px; display: block; margin-bottom: 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #treemap rect { cursor: pointer; }
  #treemap rect:hover { opacity: .8; }
  #treemap text { pointer-events: none; font-size: 11px; fill: #0e1116; font-weight: 600; }
  #treemap text.sub { font-weight: 400; opacity: .75; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 8px; border-bottom: 1px solid #1b212b; vertical-align: middle; }
  tr.dir td.name { cursor: pointer; }
  tr:hover td { background: #141a22; }
  td.size { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 90px; }
  td.gauge { width: 120px; }
  .gauge div { height: 6px; border-radius: 3px; background: var(--c-none); }
  td.name { font-weight: 500; min-width: 170px; }
  td.name .kind { display: inline-block; }
  td.name .kind { color: var(--dim); margin-right: 6px; }
  th:nth-child(2) { width: 120px; }
  td.path { color: var(--dim); font-size: 12px; word-break: break-all; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    font-weight: 600; white-space: nowrap; }
  .note { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border-radius: 999px; padding: 4px 14px; }
  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: 460px; display: none;
    background: #0b0e13; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    box-shadow: 0 8px 24px #0008; font-size: 12px; line-height: 1.45; }
  #tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  #tip .p { color: var(--dim); word-break: break-all; }
  #tip .m { color: var(--accent); font-variant-numeric: tabular-nums; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 84px; }
  td.act { width: 150px; text-align: right; white-space: nowrap; }
  td.act button { padding: 2px 9px; font-size: 12px; }
  button.inspect { padding: 1px 8px; font-size: 11px; margin-top: 5px; }
  td.act button.danger:hover { border-color: var(--c-protected); color: var(--c-protected); }
  td.act .locked { color: var(--dim); font-size: 12px; }
  .modal { position: fixed; inset: 0; background: #000a; display: flex; z-index: 30;
    align-items: center; justify-content: center; padding: 24px; }
  .modal[hidden] { display: none; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; max-width: 720px; width: 100%; max-height: 80vh; overflow: auto; }
  .sheet h2 { margin: 0 0 14px; font-size: 15px; }
  .sheet dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 16px; }
  .sheet dt { color: var(--dim); font-size: 13px; }
  .sheet dd { margin: 0; font-size: 13px; word-break: break-all; }
  .sheet .row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .sheet .go { border-color: var(--accent); color: var(--accent); }
  .sheet ul { margin: 0 0 12px; padding-left: 18px; font-size: 13px; }
  .sheet li { margin-bottom: 5px; }
  .sheet li .m { color: var(--accent); font-variant-numeric: tabular-nums; }
  .sheet .note { margin-top: 4px; }
  #a-body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
  #a-body .cost { color: var(--dim); font-size: 12px; margin-top: 14px; }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  td.pick { width: 30px; }
  #cleanbar { display: none; gap: 10px; align-items: center; margin-bottom: 12px;
    padding: 8px 12px; background: #1b2029; border: 1px solid var(--line); border-radius: 8px; }
  #cleanbar.on { display: flex; }
  .warn { background: #2d1d12; border: 1px solid #5a3a1c; color: #e0a458;
    padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>diskwise</h1>
  <div class="stat" id="summary">scanning…</div>
  <div class="spacer"></div>
  <div class="tabs">
    <button id="tab-disk" class="on">Disk</button>
    <button id="tab-proc">Processes</button>
  </div>
  <button id="rescan">Rescan</button>
  <button id="gear" title="Settings">⚙</button>
</header>

<main>
  <div id="warn"></div>
  <section id="panel-disk">
  <div class="bar">
    <button id="mode-tree" class="on">Biggest anywhere</button>
    <button id="mode-dir">Browse folders</button>
    <button id="mode-files">Files only</button>
    <select id="category"><option value="">All categories</option></select>
    <select id="min">
      <option value="1048576">≥ 1 MB</option>
      <option value="10485760" selected>≥ 10 MB</option>
      <option value="104857600">≥ 100 MB</option>
      <option value="1073741824">≥ 1 GB</option>
      <option value="0">everything</option>
    </select>
    <input id="contains" type="search" placeholder="filter by path…" size="18">
    <div class="spacer"></div>
    <div class="stat" id="reclaim"></div>
  </div>

  <div class="bar" id="askbar" hidden>
    <input id="askq" type="search" placeholder="Ask about this disk…" style="flex:1;min-width:240px">
    <button id="askgo"></button>
    <span class="note" id="askhint"></span>
  </div>
  <div id="cleanbar">
    <span id="selcount"></span>
    <button id="cleango" class="on">Clean selected…</button>
    <button id="selclear">Cancel</button>
  </div>
  <nav id="crumbs"></nav>
  <svg id="treemap"></svg>
  <table>
    <thead><tr>
      <th class="pick"></th><th id="th-size">Size</th><th></th><th id="th-name">Name</th>
      <th id="th-what">What it is</th><th id="th-path">Path</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Nothing here above the size filter.</div>
  </section>

  <section id="panel-proc" hidden>
    <div class="bar">
      <button id="sort-cpu" class="on">By CPU</button>
      <button id="sort-mem">By memory</button>
      <button id="sort-up">By uptime</button>
      <select id="pdays">
        <option value="0">any age</option>
        <option value="0.5">running &gt; 12h</option>
        <option value="1">running &gt; 1 day</option>
        <option value="3">running &gt; 3 days</option>
        <option value="7">running &gt; 7 days</option>
      </select>
      <label class="stat"><input type="checkbox" id="pmine" checked> only mine</label>
      <input id="pfind" type="search" placeholder="filter by name or path…" size="18">
      <div class="spacer"></div>
      <div class="stat" id="psummary"></div>
    </div>
    <svg id="cpumap"></svg>
    <table>
      <thead><tr>
        <th>PID</th><th>CPU%</th><th></th><th>Memory</th><th>Uptime</th><th>Process</th><th></th>
      </tr></thead>
      <tbody id="prows"></tbody>
    </table>
  </section>
</main>

<div class="modal" id="settings" hidden>
  <div class="sheet">
    <h2 id="s-title">Settings</h2>
    <div class="row">
      <label id="s-lang-label">Language</label>
      <select id="s-lang">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
      </select>
    </div>
    <h2 id="s-policy-title">Safety policy</h2>
    <dl id="s-policy"></dl>
    <div class="actions"><button id="s-close">Close</button></div>
  </div>
</div>

<div class="modal" id="askmodal" hidden>
  <div class="sheet">
    <h2 id="a-title"></h2>
    <div id="a-body"></div>
    <div class="actions"><button id="a-close"></button></div>
  </div>
</div>

<div class="modal" id="planmodal" hidden>
  <div class="sheet">
    <h2 id="p-title">Review this plan</h2>
    <div id="p-body"></div>
    <div class="actions">
      <button id="p-cancel">Cancel</button>
      <button id="p-go" class="go">Apply</button>
    </div>
  </div>
</div>

<div id="tip"></div>

<script src="/app.js"></script>
</body>
</html>
